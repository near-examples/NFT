name: Tests
on: push
jobs:
  tests:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-near
        run: cargo install --locked cargo-near

      - name: Install and test modules
        run: |
          cargo test
